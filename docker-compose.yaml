version: "3"
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        - "HOST_UID=1000"
    env_file:
      - .env
    environment:
      - "DB_HOST=postgres"
      - "PORT=8000"
    ports:
      - "8000:8000"
      - "5173:5173"
    volumes:
      - "./app:/var/www/app"
      - "./storage:/var/www/storage"
      - "./resources:/var/www/resources"
      - "./routes:/var/www/routes"
    depends_on:
      - postgres

  queue:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        - "HOST_UID=1000"
    env_file:
      - .env
    environment:
      - "DB_HOST=postgres"
    volumes:
      - "./app:/var/www/app"
      - "./storage:/var/www/storage"
    depends_on:
      - postgres
    command: php artisan queue:work --sleep=3 --tries=3

  reverb:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        - "HOST_UID=1000"
    env_file:
      - .env
    environment:
      - "DB_HOST=postgres"
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    command: php artisan reverb:start --host=0.0.0.0 --port=8080

  smtp:
    image: namshi/smtp
    restart: always
    environment:
      MAILNAME: "atrellado.toino.pt"
    expose:
      - "25"

  postgres:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pg!password
    ports:
      - "5432:5432"
    expose:
      - "5432"

  pgadmin:
    image: dpage/pgadmin4:9
    environment:
      PGADMIN_DEFAULT_EMAIL: postgres@lbaw.com
      PGADMIN_DEFAULT_PASSWORD: pg!password
    ports:
      - "4321:80"
    depends_on:
      - postgres
